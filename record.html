<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기록 — healthydiet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..112,400..900&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="bar">
  <a class="bar__logo" href="index.html">healthy<span>diet</span></a>
  <nav class="nav" aria-label="주요 메뉴">
    <a href="index.html">홈</a>
    <a href="record.html" class="is-current" aria-current="page">기록</a>
    <a href="#stats">통계</a>
    <a href="#tools">데이터</a>
  </nav>
</header>

<main class="wrap">

  <div class="page-head">
    <h1>오늘의 기록</h1>
    <time id="todayDate"></time>
  </div>

  <div class="grid-2">
    <!-- 오늘의 체중. 기록이 없으면 통째로 숨긴다 -->
    <section class="card card--green" id="today" hidden>
      <p class="card__label">오늘의 체중</p>
      <p class="card__big"><span id="todayWeight">—</span><sub>kg</sub></p>
      <div class="ruler"><div class="ruler__needle" id="rulerNeedle"></div></div>
      <p class="ruler__legend">
        <span id="weightMin">—</span>
        <span id="weightToday">—</span>
      </p>
    </section>

    <!-- 명세 필수 ②③ 목록 조회 · 삭제 -->
    <section class="card">
      <h2>활동 목록 <span class="count" id="listCount"></span></h2>
      <div id="list"></div>
    </section>
  </div>

  <div class="stack">

    <!-- 명세 필수 ① 활동 등록 -->
    <section class="card">
      <h2>기록 추가</h2>

      <form id="addForm" novalidate>
        <div class="grid">
          <div class="field field--wide">
            <label for="f-title">활동명</label>
            <input type="text" id="f-title" name="title" placeholder="러닝 5km">
            <p class="err" data-err="title"></p>
          </div>

          <div class="field">
            <label for="f-date">날짜</label>
            <input type="date" id="f-date" name="date">
            <p class="err" data-err="date"></p>
          </div>

          <div class="field">
            <label for="f-place">장소</label>
            <input type="text" id="f-place" name="place" placeholder="한강공원">
            <p class="err" data-err="place"></p>
          </div>

          <div class="field">
            <label for="f-memberCount">참여 인원</label>
            <input type="number" id="f-memberCount" name="memberCount" min="1" step="1" placeholder="4">
            <p class="err" data-err="memberCount"></p>
          </div>

          <div class="field">
            <label for="f-category">종목</label>
            <select id="f-category" name="category">
              <option value="유산소">유산소</option>
              <option value="근력">근력</option>
              <option value="스트레칭">스트레칭</option>
            </select>
            <p class="err" data-err="category"></p>
          </div>

          <div class="field">
            <label for="f-durationMin">운동 시간 <span class="unit">분</span></label>
            <input type="number" id="f-durationMin" name="durationMin" min="1" step="1" placeholder="45">
            <p class="err" data-err="durationMin"></p>
          </div>

          <div class="field">
            <label for="f-weightKg">체중 <span class="unit">kg · 선택</span></label>
            <input type="number" id="f-weightKg" name="weightKg" step="0.1" placeholder="68.4">
            <p class="err" data-err="weightKg"></p>
          </div>

          <div class="field">
            <label for="f-kcalIn">섭취 <span class="unit">kcal · 선택</span></label>
            <input type="number" id="f-kcalIn" name="kcalIn" step="1" placeholder="1800">
            <p class="err" data-err="kcalIn"></p>
          </div>

          <div class="field field--wide">
            <label for="f-memo">메모</label>
            <input type="text" id="f-memo" name="memo" placeholder="페이스 6:10">
            <p class="err" data-err="memo"></p>
          </div>
        </div>

        <div class="form__foot">
          <p class="form__msg" id="formMsg" role="status"></p>
          <button class="btn btn--green" type="submit">기록 저장</button>
        </div>
      </form>
    </section>

    <!-- 통계. 기록이 없으면 숨긴다 -->
    <section class="card" id="stats" hidden>
      <h2>통계</h2>

      <dl class="summary" id="summary"></dl>

      <h3>월별 활동 횟수</h3>
      <div id="monthly"></div>

      <h3>종목별</h3>
      <div id="byCategory"></div>

      <h3>감량 효과 Top3</h3>
      <table class="table" id="rankExercise"></table>
      <table class="table" id="rankFood"></table>

      <h3>피해야 할 항목</h3>
      <table class="table" id="rankAvoid"></table>
      <p class="note">
        기록한 날부터 다음 측정까지의 체중 변화를 그날 한 운동과 먹은 음식에 나눠 귀속한 값입니다.
        인과가 아니라 경향이므로 표본 수를 함께 보세요. 표본 3회 미만은 순위에서 제외합니다.
      </p>

      <h3>칼로리 수지</h3>
      <table class="table" id="kcalTable"></table>
      <p class="note">소모량은 운동 시간과 종목으로 추정한 값입니다.</p>
    </section>

    <section class="card" id="tools">
      <h2>데이터</h2>
      <div class="tools">
        <button class="btn" type="button" id="btnSeed">샘플 데이터 생성</button>
        <button class="btn" type="button" id="btnExport">JSON 내보내기</button>
        <button class="btn" type="button" id="btnImport">JSON 가져오기</button>
        <input type="file" id="fileInput" accept="application/json,.json" hidden>
      </div>
      <p class="form__msg" id="toolMsg" role="status"></p>
    </section>

  </div>
</main>

<script src="js/store/store.js"></script>
<script src="js/analytics/analytics.js"></script>
<script src="js/ui/ui.js"></script>
</body>
</html>
